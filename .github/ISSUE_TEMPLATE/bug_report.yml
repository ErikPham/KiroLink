name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `kirolink --verbose`
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KiroLink version
      description: Output of `kirolink --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node version and OS
      placeholder: Node 22.1.0, macOS 15.3
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Claude Code, Codex, curl / custom, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Verbose output
      description: Output with `--verbose`. Redact any tokens or identifiers.
      render: shell
